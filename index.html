<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像アップロード</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>画像アップロード</h1>

        <div class="upload-area" id="uploadArea">
            <input type="file" id="fileInput" accept="image/*" multiple hidden>
            <label for="fileInput" class="upload-label">
                <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                <p class="upload-text">クリックまたはドラッグ&amp;ドロップで画像を選択</p>
                <p class="upload-hint">JPG, PNG, GIF, WebP に対応</p>
            </label>
        </div>

        <div class="preview-container" id="previewContainer"></div>

        <div class="actions" id="actions" hidden>
            <button type="button" id="clearBtn" class="btn btn-secondary">クリア</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
